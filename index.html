<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>数绘湾区红脉 · 践行医者初心 —— 思政数字地图</title>
<meta name="description" content="以国家标准版中国地图为底图，从地球逐级展开至省、市、区县、乡镇的思政数字地图互动作品。" />
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./vendor/maplibre-gl.css" />
<link rel="stylesheet" href="./assets/style.css" />
</head>
<body>

<script>
/* 运行期错误收集：写入隐藏节点并输出到控制台 */
window.__ERRS = [];
function __logErr(msg) {
  window.__ERRS.push(msg);
  var d = document.getElementById('diag');
  if (d) d.textContent = 'ERR ' + window.__ERRS.join(' || ');
  console.error('[szMap]', msg);
}
window.addEventListener('error', function (e) {
  __logErr((e.message || 'error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || ''));
});
window.addEventListener('unhandledrejection', function (e) {
  __logErr('REJECT ' + ((e.reason && e.reason.message) || String(e.reason)));
});
</script>

<!-- 全屏作用于 #app，保证界面控件一并进入全屏 -->
<div id="app">

  <div id="map" aria-label="中国思政数字地图"></div>

  <!-- 载入动画 -->
  <div id="boot" class="boot">
    <div class="boot__seal">思政<br>地图</div>
    <div class="boot__text">
      <p class="boot__t1">数绘湾区红脉 <span>·</span> 践行医者初心</p>
      <p class="boot__t2">正在加载国家标准版底图…</p>
    </div>
    <div class="boot__bar"><i></i></div>
  </div>

  <!-- 左上：标题 -->
  <header class="hud hud--title" data-ui>
    <div class="seal">思政<br>地图</div>
    <div class="titles">
      <h1>数绘湾区红脉<span class="dot">·</span>践行医者初心<em>（广东版）</em></h1>
    </div>
  </header>

  <!-- 右上：控件 -->
  <div class="hud hud--tools" data-ui>
    <button class="tool" id="btn-search" title="搜索红色场馆">⌕</button>
    <button class="tool" id="btn-hide" title="隐藏界面（快捷键 H）">隐</button>
    <button class="tool" id="btn-3d" title="广东 3D 立体地图">3D</button>
    <button class="tool" id="btn-replay" title="重播开场">↻</button>
    <button class="tool" id="btn-basemap" title="切换卫星 / 标准底图">卫</button>
    <button class="tool" id="btn-panel" title="作品说明">说</button>
    <button class="tool" id="btn-full" title="全屏">全</button>
  </div>

  <!-- 搜索：点 ⌕ 展开，与控件同区 -->
  <div class="searchwrap" id="searchwrap" data-ui hidden>
    <input id="q" type="search" autocomplete="off" placeholder="搜索红色场馆 / 市 / 区县" aria-label="搜索" />
    <button class="search__clear" id="q-clear" aria-label="清除">×</button>
    <div class="qs" id="qs" hidden></div>
  </div>

  <!-- 红色传承提示（当某地铺满屏幕 75% 以上时出现） -->
  <div class="hud hud--red" id="redpanel" data-ui hidden>
    <div class="red__hd" id="red-title"></div>
    <div class="red__body" id="red-body"></div>
  </div>

  <!-- 左下：面包屑 + 展开进度 -->
  <div class="hud hud--nav" data-ui>
    <nav class="crumb" id="crumb" aria-label="层级导航"></nav>
    <div class="progress" id="progress">
      <div class="progress__row">
        <span class="progress__label" id="pg-label">等待选择</span>
        <span class="progress__count" id="pg-count"></span>
      </div>
      <div class="progress__track"><i id="pg-bar"></i></div>
      <div class="progress__basis" id="pg-basis"></div>
    </div>
  </div>

  <!-- 右下：南海诸岛附图 -->
  <div id="inset" data-ui hidden></div>

  <!-- 右下：图例 -->
  <div class="hud hud--legend" id="legend" data-ui>
    <div class="legend__title">图例</div>
    <div class="legend__item"><i class="sw sw--core"></i>省府 / 市府</div>
    <div class="legend__item"><i class="sw sw--region"></i>下辖行政区</div>
    <div class="legend__item"><i class="sw sw--sea"></i>南海诸岛（十段线）</div>
  </div>

  <!-- 底部提示 -->
  <div class="hud hud--hint" id="hint" data-ui>
    <span class="hint__ico">◎</span>
    <span id="hint-text">点击任意省份，逐级展开它的市、区县与乡镇</span>
  </div>

  <!-- 右侧面板 -->
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel__head">
      <h2 id="panel-title">作品说明</h2>
      <button class="panel__close" id="panel-close" aria-label="关闭">×</button>
    </div>
    <div class="panel__body" id="panel-body"></div>
  </aside>

  <!-- 弹层 -->
  <div class="toast" id="toast"></div>

  <!-- 悬停提示：跟随指针显示所属 -->
  <div class="tip" id="tip" hidden></div>

  <!-- 点击区块后显示的信息卡（不遮挡拖动） -->
  <div class="spot" id="spot" hidden>
    <button class="spot__close" id="spot-close" aria-label="关闭">×</button>
    <div class="spot__body" id="spot-body"></div>
  </div>

  <!-- 隐藏界面后的恢复按钮（始终可点） -->
  <button class="ui-restore" id="btn-show" title="显示界面（快捷键 H）">
    <span class="ui-restore__ico">显</span>
  </button>

</div>

<div id="diag" hidden></div>

<script src="./config.js"></script>
<script src="./data/gdp.js"></script>
<script src="./data/red-sites.js"></script>
<script src="./vendor/maplibre-gl.js"></script>
<script src="./assets/app.js"></script>
</body>
</html>
